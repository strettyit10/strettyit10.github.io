<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoyaDocs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Brand (top-left) ── */
    .brand {
      position: fixed;
      top: 28px;
      left: 36px;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
      z-index: 10;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }

    /* ── Read Me link (directly below brand) ── */
    .readme-link {
      position: fixed;
      top: 82px;
      left: 38px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.75);
      text-decoration: underline;
      text-underline-offset: 3px;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
      transition: color 0.15s;
    }
    .readme-link:hover { color: #fff; }
    .readme-link.hidden, .readme-link.hidden:hover { color: #000; text-shadow: none; pointer-events: none; cursor: default; user-select: none; }

    /* ── STEP 1 link (top-right) ── */
    .step1-link {
      position: fixed;
      top: 30px;
      right: 36px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px 11px 22px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 6px 24px rgba(255,255,255,0.18);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .step1-link small {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      opacity: 0.55;
    }
    .step1-link svg { width: 15px; height: 15px; transition: transform 0.15s; }
    .step1-link:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,255,255,0.28); }
    .step1-link:hover svg { transform: translateX(3px); }

    /* ── Stage: centers the body image ── */
    .stage {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;          /* respects mobile browser chrome */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0 60px;        /* keeps brand + caption from covering body */
    }

    /* Body frame is height-dominant since the image is portrait 2:3.
       Callouts use % positioning so they stay locked to anatomy at any size. */
    .body-frame {
      position: relative;
      /* width-driven so the frame always matches the image (no letterboxing) */
      width: min(92vw, calc(85vh * 2 / 3));
      width: min(92vw, calc(85dvh * 2 / 3));
      aspect-ratio: 1024 / 1536;
      container-type: inline-size;
    }

    .body-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── Callout anchors ── */
    .callout {
      position: absolute;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dot {
      position: absolute;
      top: 1px; left: 1px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15),
                  0 0 20px 4px rgba(255,255,255,0.4);
      z-index: 2;
    }

    .dot::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.55);
      animation: pulse 2.2s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.9; }
      80%  { transform: scale(2.3); opacity: 0;   }
      100% { transform: scale(2.3); opacity: 0;   }
    }

    .line {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 1.5px;
      background: rgba(255,255,255,0.7);
      transform-origin: 0 50%;
      z-index: 1;
    }

    .pill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 18px;
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
      z-index: 2;
    }

    .pill small {
      display: block;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      opacity: 0.7;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .callout:hover .pill {
      background: #fff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 8px 28px rgba(255,255,255,0.25);
    }
    .callout:hover .pill small { opacity: 0.6; }

    .callout:hover .dot {
      box-shadow: 0 0 0 4px rgba(255,255,255,0.25),
                  0 0 28px 6px rgba(255,255,255,0.55);
    }

    /* ── Blue-filled pills (Block 2 + Block 6). Add "fill-blue" to a callout's class to use it. ── */
    .callout.fill-blue .pill { background: #1d5fd6; border-color: #3b82f6; color: #fff; }
    .callout.fill-blue:hover .pill { background: #3b82f6; border-color: #93c5fd; color: #fff; box-shadow: 0 8px 28px rgba(59,130,246,0.45); }
    .callout.fill-blue:hover .pill small { opacity: 0.75; }

    /* ── Per-region placement (tuned to 1024×1536 portrait) ── */

    /* HNSS — head / face, pill to the LEFT (extended to clear the hand) */
    .callout-hnss  { top: 9%; left: 50%; }
    .callout-hnss  .line { width: 240px; transform: rotate(180deg); }
    .callout-hnss  .pill { right: 250px; }

    /* ENDO — thyroid, pill to the RIGHT (extended to clear the hand) */
    .callout-endo  { top: 17%; left: 50%; }
    .callout-endo  .line { width: 240px; transform: rotate(0deg); }
    .callout-endo  .pill { left: 250px; }

    /* GI — stomach + intestines, pill to the LEFT (extended to clear the hand) */
    .callout-gi    { top: 37%; left: 50%; }
    .callout-gi    .line { width: 240px; transform: rotate(180deg); }
    .callout-gi    .pill { right: 250px; }

    /* REPRO — pelvis (just below the intestines), pill to the RIGHT (extended to clear the hand) */
    .callout-repro { top: 46%; left: 50%; }
    .callout-repro .line { width: 240px; transform: rotate(0deg); }
    .callout-repro .pill { left: 250px; }

    /* ── Placeholders / deactivated units (greyed + not clickable). To (re)activate one, delete the word "soon" from its class. ── */
    .callout.soon { pointer-events: none; }
    .callout.soon .pill { border-style: dashed; border-color: rgba(255,255,255,0.45); color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.45); }
    .callout.soon .dot { background: rgba(255,255,255,0.55); box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
    .callout.soon .dot::after { display: none; }
    .callout.soon .line { background: rgba(255,255,255,0.35); }

    /* IMMUNO — axillary lymph nodes */
    .callout-immuno { top: 18%; left: 38%; }
    .callout-immuno .line { width: 179px; transform: rotate(180deg); }
    .callout-immuno .pill { right: 189px; }

    /* MICRO — lower leg */
    .callout-micro { top: 76%; left: 39%; }
    .callout-micro .line { width: 184px; transform: rotate(180deg); }
    .callout-micro .pill { right: 194px; }

    /* CARDIO — heart */
    .callout-cardio { top: 26%; left: 52%; }
    .callout-cardio .line { width: 230px; transform: rotate(0deg); }
    .callout-cardio .pill { left: 240px; }

    /* PULMONARY — lung */
    .callout-pulm { top: 28%; left: 43%; }
    .callout-pulm .line { width: 204px; transform: rotate(180deg); }
    .callout-pulm .pill { right: 214px; }

    /* RENAL — kidney */
    .callout-renal { top: 35%; left: 56%; }
    .callout-renal .line { width: 209px; transform: rotate(0deg); }
    .callout-renal .pill { left: 219px; }

    /* CNS — brain, pill to the RIGHT */
    .callout-cns   { top: 4.5%; left: 50%; }
    .callout-cns   .line { width: 240px; transform: rotate(0deg); }
    .callout-cns   .pill { left: 250px; }

    /* HEME — femur / bone marrow, pill to the RIGHT */
    .callout-heme  { top: 56%; left: 60%; }
    .callout-heme  .line { width: 190px; transform: rotate(0deg); }
    .callout-heme  .pill { left: 200px; }

    /* MSK — knee (bones + muscle), pill to the LEFT */
    .callout-msk   { top: 64%; left: 40%; }
    .callout-msk   .line { width: 180px; transform: rotate(180deg); }
    .callout-msk   .pill { right: 190px; }

    /* ── Desktop: pills sit fully OUTSIDE the body image (lines run from dot to past the image edge).
       Line length = distance from the dot to the frame edge (in cqw = % of image width) + a fixed gap.
       If you add a new region, use its left% here (left-side pills) or 100 − left% (right-side pills). ── */
    @media (min-width: 961px) {
      .body-frame {
        width: min(calc(100vw - 480px), calc(85vh * 2 / 3));
        width: min(calc(100vw - 480px), calc(85dvh * 2 / 3));
        --gap: 36px;
      }
      .callout-hnss .line { width: calc(50cqw + var(--gap)); }
      .callout-hnss .pill { right: calc(50cqw + var(--gap) + 10px); }
      .callout-gi .line { width: calc(50cqw + var(--gap)); }
      .callout-gi .pill { right: calc(50cqw + var(--gap) + 10px); }
      .callout-immuno .line { width: calc(38cqw + var(--gap)); }
      .callout-immuno .pill { right: calc(38cqw + var(--gap) + 10px); }
      .callout-micro .line { width: calc(39cqw + var(--gap)); }
      .callout-micro .pill { right: calc(39cqw + var(--gap) + 10px); }
      .callout-pulm .line { width: calc(43cqw + var(--gap)); }
      .callout-pulm .pill { right: calc(43cqw + var(--gap) + 10px); }
      .callout-msk .line { width: calc(40cqw + var(--gap)); }
      .callout-msk .pill { right: calc(40cqw + var(--gap) + 10px); }
      .callout-endo .line { width: calc(50cqw + var(--gap)); }
      .callout-endo .pill { left: calc(50cqw + var(--gap) + 10px); }
      .callout-repro .line { width: calc(50cqw + var(--gap)); }
      .callout-repro .pill { left: calc(50cqw + var(--gap) + 10px); }
      .callout-cardio .line { width: calc(48cqw + var(--gap)); }
      .callout-cardio .pill { left: calc(48cqw + var(--gap) + 10px); }
      .callout-renal .line { width: calc(44cqw + var(--gap)); }
      .callout-renal .pill { left: calc(44cqw + var(--gap) + 10px); }
      .callout-cns .line { width: calc(50cqw + var(--gap)); }
      .callout-cns .pill { left: calc(50cqw + var(--gap) + 10px); }
      .callout-heme .line { width: calc(40cqw + var(--gap)); }
      .callout-heme .pill { left: calc(40cqw + var(--gap) + 10px); }
    }

    /* ══════════════════════════════════════
       RESPONSIVE
       Desktop defaults above. Below: tablet → phone → small phone.
       Pills alternate sides, always aligned with the dot.
    ══════════════════════════════════════ */

    /* ── Tablet / small laptop ── */
    @media (max-width: 960px) {
      .brand { font-size: 2rem; top: 22px; left: 24px; }
      .readme-link { top: 64px; left: 26px; font-size: 0.82rem; }
      .step1-link { top: 22px; right: 24px; font-size: 0.9rem; padding: 10px 16px 10px 18px; }

      .callout-hnss  .line { width: 120px; }
      .callout-hnss  .pill { right: 130px; }

      .callout-endo  .line { width: 120px; }
      .callout-endo  .pill { left: 130px; }

      .callout-gi    .line { width: 120px; }
      .callout-gi    .pill { right: 130px; }

      .callout-repro .line { width: 120px; }
      .callout-repro .pill { left: 130px; }

      .callout-immuno .line { width: 52px; }
      .callout-immuno .pill { right: 62px; }

      .callout-micro .line { width: 58px; }
      .callout-micro .pill { right: 68px; }

      .callout-cardio .line { width: 109px; }
      .callout-cardio .pill { left: 119px; }

      .callout-pulm .line { width: 80px; }
      .callout-pulm .pill { right: 90px; }

      .callout-renal .line { width: 86px; }
      .callout-renal .pill { left: 96px; }

      .callout-heme  .line { width: 80px; }
      .callout-heme  .pill { left: 90px; }

      .callout-cns   .line { width: 120px; }
      .callout-cns   .pill { left: 130px; }

      .callout-msk   .line { width: 70px; }
      .callout-msk   .pill { right: 80px; }

      .pill { font-size: 0.85rem; padding: 9px 15px; }
      .pill small { font-size: 0.58rem; }
    }

    /* ── Short screens (laptops): slimmer pills so stacked callouts don't touch ── */
    @media (min-width: 641px) and (max-height: 820px) {
      .pill { font-size: 0.8rem; padding: 6px 14px; }
      .pill small { font-size: 0.55rem; margin-bottom: 1px; }
    }

    /* ── Phone ── */
    @media (max-width: 640px) {
      .brand { font-size: 1.5rem; top: 16px; left: 18px; }
      .readme-link { top: 48px; left: 20px; font-size: 0.75rem; }
      .step1-link { top: 16px; right: 16px; font-size: 0.8rem; padding: 8px 13px 8px 15px; gap: 7px; }
      .step1-link small { display: none; }
      .step1-link svg { width: 12px; height: 12px; }

      .body-frame { width: min(78vw, calc(72vh * 2 / 3)); width: min(78vw, calc(72dvh * 2 / 3)); }

      .callout-hnss  .line { width: 28px; }
      .callout-hnss  .pill { right: 34px; }

      .callout-endo  .line { width: 28px; }
      .callout-endo  .pill { left: 34px; }

      .callout-gi    .line { width: 28px; }
      .callout-gi    .pill { right: 34px; }

      .callout-repro .line { width: 28px; }
      .callout-repro .pill { left: 34px; }

      .callout-immuno .line { width: 22px; }
      .callout-immuno .pill { right: 28px; }

      .callout-micro .line { width: 22px; }
      .callout-micro .pill { right: 28px; }

      .callout-cardio .line { width: 22px; }
      .callout-cardio .pill { left: 28px; }

      .callout-pulm .line { width: 22px; }
      .callout-pulm .pill { right: 28px; }

      .callout-renal .line { width: 22px; }
      .callout-renal .pill { left: 28px; }

      .callout-heme  .line { width: 22px; }
      .callout-heme  .pill { left: 28px; }

      .callout-cns   .line { width: 28px; }
      .callout-cns   .pill { left: 34px; }

      .callout-msk   .line { width: 22px; }
      .callout-msk   .pill { right: 28px; }

      .pill {
        font-size: 0.75rem;
        padding: 9px 13px;           /* ≥44px tap-height w/ line-height */
        border-width: 1.25px;
      }
      .pill small { display: none; } /* hide "Block" prefix to save space */

      .dot  { width: 14px; height: 14px; top: 3px; left: 3px; }
      .line { height: 1.25px; }
      .caption { font-size: 0.62rem; bottom: 14px; letter-spacing: 0.14em; }
    }

    /* ── Very small phones (≤ iPhone SE width) ── */
    @media (max-width: 380px) {
      .body-frame { width: min(72vw, calc(72vh * 2 / 3)); width: min(72vw, calc(72dvh * 2 / 3)); }

      .callout-hnss  .line { width: 20px; }
      .callout-hnss  .pill { right: 26px; }

      .callout-endo  .line { width: 20px; }
      .callout-endo  .pill { left: 26px; }

      .callout-gi    .line { width: 20px; }
      .callout-gi    .pill { right: 26px; }

      .callout-repro .line { width: 20px; }
      .callout-repro .pill { left: 26px; }

      .callout-immuno .line { width: 16px; }
      .callout-immuno .pill { right: 22px; }

      .callout-micro .line { width: 16px; }
      .callout-micro .pill { right: 22px; }

      .callout-cardio .line { width: 16px; }
      .callout-cardio .pill { left: 22px; }

      .callout-pulm .line { width: 16px; }
      .callout-pulm .pill { right: 22px; }

      .callout-renal .line { width: 16px; }
      .callout-renal .pill { left: 22px; }

      .callout-heme  .line { width: 16px; }
      .callout-heme  .pill { left: 22px; }

      .callout-cns   .line { width: 20px; }
      .callout-cns   .pill { left: 26px; }

      .callout-msk   .line { width: 16px; }
      .callout-msk   .pill { right: 22px; }

      .pill { font-size: 0.68rem; padding: 8px 11px; }
    }

    /* ── Landscape phones: body image gets short on height — shrink and keep callouts on sides ── */
    @media (max-height: 480px) and (orientation: landscape) {
      .stage { padding: 50px 0 40px; }
      .body-frame { width: min(46vw, calc(85vh * 2 / 3)); width: min(46vw, calc(85dvh * 2 / 3)); }
      .brand { font-size: 1.4rem; top: 14px; left: 16px; }
      .readme-link { top: 42px; left: 18px; font-size: 0.72rem; }
      .step1-link { top: 12px; right: 16px; font-size: 0.75rem; padding: 7px 12px; }
      .caption { display: none; }
    }

    /* ── Bottom caption (tiny, unobtrusive) ── */
    .caption {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      z-index: 10;
    }
  </style>
</head>

<body>
  <div class="brand">HoyaDocs</div>
  <!-- Read Me temporarily hidden. To restore: change data-href back to href and delete the word "hidden" from the class. -->
  <a class="readme-link hidden" data-href="https://hoyadocs.com/hoyadocs-101" tabindex="-1" aria-hidden="true">Read Me</a>
  <a class="step1-link" href="https://www.hoyadocs.com/Step1" aria-label="USMLE Step 1">
    <small>USMLE</small>Step 1
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
  </a>

  <div class="stage">
    <div class="body-frame">
      <img class="body-img" src="body-atlas.jpg" alt="Human body atlas" />

      <!-- HNSS — head / face -->
      <a class="callout callout-hnss" href="https://www.hoyadocs.com/Block5-HNSS" aria-label="HNSS Hub">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 5</small>HNSS</span>
      </a>

      <!-- ENDO — neck / thyroid -->
      <a class="callout callout-endo soon" href="https://strettyit10.github.io/Block4-Endocrine/" aria-label="Endocrine Hub (unavailable)" tabindex="-1">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 4</small>Endocrine</span>
      </a>

      <!-- GI — stomach / intestines -->
      <a class="callout callout-gi soon" href="https://strettyit10.github.io/Block4-GI/" aria-label="GI Hub (unavailable)" tabindex="-1">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 4</small>GI</span>
      </a>

      <!-- REPRO — pelvis -->
      <a class="callout callout-repro soon" href="https://strettyit10.github.io/Block4-Repro/" aria-label="Repro Hub (unavailable)" tabindex="-1">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 4</small>Reproduction</span>
      </a>

      <!-- HEME — femur / bone marrow -->
      <a class="callout callout-heme" href="https://hoyadocs.com/Block5-HEME" aria-label="HEME Hub">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 5</small>HEME</span>
      </a>

      <!-- MSK — knee -->
      <a class="callout callout-msk" href="https://www.hoyadocs.com/Block5-MSK" aria-label="MSK Hub">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 5</small>MSK</span>
      </a>

      <!-- CNS — brain -->
      <a class="callout callout-cns fill-blue" href="https://www.hoyadocs.com/Block6-CNS" aria-label="CNS Hub">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 6</small>CNS</span>
      </a>

      <!-- IMMUNO — axillary lymph nodes -->
      <a class="callout callout-immuno fill-blue" href="https://www.hoyadocs.com/Block2-Immuno" aria-label="Immuno Hub">
        <span class="dot"></span>
        <span class="line"></span>
        <span class="pill"><small>Block 2</small>Immuno</span>
      </a>

      <!-- MICRO — lower leg -->
      <a class="callout callout-micro fill-blue" href="https://www.hoyadocs.com/Block2-Micro" aria-label="Micro Hub">
